<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Āsana Flashcards — Sanskrit pose names</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EA; --surface:#FBFCF8; --ink:#1F2E38; --muted:#5D6B72;
  --line:#CBD2CB; --marigold:#C9821E; --marigold-soft:#F4E2C4;
  --sage:#4E7A5E; --fig-near:#EADBC2; --fig-far:#C2B293; --fig-ink:#2B3A42; --sage-soft:#DCE8DF; --plum:#8A4566; --plum-soft:#F0DDE6;
  --serif:"Gentium Book Plus","Noto Serif","Georgia",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141C21; --surface:#1D282F; --ink:#E7ECE6; --muted:#9AA8AD;
    --line:#33434B; --marigold:#E3A24A; --marigold-soft:#3A2E1C;
    --sage:#7FB492; --fig-near:#B9C6C9; --fig-far:#7D8D93; --fig-ink:#0E1519; --sage-soft:#1F3328; --plum:#D28AAC; --plum-soft:#3A2230;
  }
}
:root[data-theme="dark"]{
  --paper:#141C21; --surface:#1D282F; --ink:#E7ECE6; --muted:#9AA8AD;
  --line:#33434B; --marigold:#E3A24A; --marigold-soft:#3A2E1C;
  --sage:#7FB492; --fig-near:#B9C6C9; --fig-far:#7D8D93; --fig-ink:#0E1519; --sage-soft:#1F3328; --plum:#D28AAC; --plum-soft:#3A2230;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--marigold);outline-offset:3px}

.wrap{max-width:760px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;margin-bottom:22px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,6vw,2.75rem);line-height:1.1;margin:0;letter-spacing:-.01em}
.tagline{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.stats{font-size:.9rem;color:var(--muted);text-align:right}
.stats strong{color:var(--sage);font-weight:600}

.controls{display:grid;gap:12px;margin-bottom:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--marigold);background:var(--marigold-soft);color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--marigold);width:16px;height:16px}
.spacer{flex:1}
.link{border:0;background:none;color:var(--muted);font-size:.85rem;text-decoration:underline;text-underline-offset:3px;padding:4px}

/* Card */
.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:420px;border:0;padding:0;background:none;text-align:center;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 24px;background:var(--surface);border:1px solid var(--line);border-radius:6px 28px 6px 28px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.cat{font-size:.8rem;color:var(--muted)}
.big{font-family:var(--serif);font-size:clamp(2rem,7.5vw,3.4rem);line-height:1.1;margin:0;overflow-wrap:anywhere}
.iast{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:1.1rem}
.mid{font-family:var(--serif);font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.15;margin:0}
.fig{width:min(100%,260px);height:auto;display:block}
.fig polyline,.fig path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:7}
.fig .near{stroke:var(--ink)} .fig .far{stroke:var(--muted);opacity:.55}
.fig .floor{stroke:var(--line);stroke-width:2} .fig .head{fill:var(--surface);stroke:var(--ink);stroke-width:5}
.fig.small{width:120px;margin-bottom:-6px}
.art{display:block;width:min(100%,300px);max-height:250px;object-fit:contain;mix-blend-mode:multiply}
.art.small{width:130px;max-height:110px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .art{filter:invert(.92);mix-blend-mode:screen}}
:root[data-theme="dark"] .art{filter:invert(.92);mix-blend-mode:screen}
.prompt{font-family:var(--serif);font-size:1.15rem;color:var(--muted);margin:0}
.hint{position:absolute;bottom:14px;left:0;right:0;font-size:.8rem;color:var(--muted)}

/* Roots: the signature element */
.roots{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:4px 6px;margin-top:14px}
.root{display:flex;flex-direction:column;align-items:center;min-width:3.5rem}
.root b{font-family:var(--serif);font-weight:400;font-size:1.15rem;padding:0 4px 3px;border-bottom:2px solid var(--marigold)}
.root span{font-size:.78rem;color:var(--muted);margin-top:4px;max-width:9rem;line-height:1.3}
.plus{font-family:var(--serif);color:var(--marigold);font-size:1.15rem;padding-top:1px}

.actions{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px;margin-top:18px;align-items:stretch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:500}
.btn.learn{background:var(--plum-soft);border-color:transparent;color:var(--plum)}
.btn.know{background:var(--sage-soft);border-color:transparent;color:var(--sage)}
.btn.nav{width:48px;font-size:1.2rem;padding:0}
.btn:disabled{opacity:.4;cursor:default}
.progress{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:14px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);transition:width .3s}
.keys{font-size:.8rem;color:var(--muted);margin-top:18px;text-align:center}
kbd{font-family:var(--sans);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* Quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:6px 28px 6px 28px;padding:28px 22px;text-align:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px 12px;font-family:var(--serif);font-size:1.1rem;line-height:1.25}
.opt.right{background:var(--sage-soft);border-color:var(--sage);color:var(--ink)}
.opt.wrong{background:var(--plum-soft);border-color:var(--plum);color:var(--ink)}
.opt:disabled{cursor:default}
.feedback{min-height:1.5em;margin-top:16px;font-weight:500}
.feedback.good{color:var(--sage)} .feedback.bad{color:var(--plum)}
.next{margin-top:12px;background:var(--ink);color:var(--paper);border:0}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px 28px 6px 28px;padding:40px 24px;text-align:center}
.empty p{margin:0 0 14px}
footer{margin-top:36px;font-size:.8rem;color:var(--muted);text-align:center}

@media (max-width:520px){
  .options{grid-template-columns:1fr}
  .actions{grid-template-columns:44px 1fr 1fr 44px}
  .btn.nav{width:44px}
  .stats{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .bar i{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Āsana Flashcards</h1>
      <p class="tagline">See the pose, say its Sanskrit name, then check yourself.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <div class="row">
      <div class="seg" role="group" aria-label="Pose set">
        <button data-set="general" aria-pressed="true">All poses</button>
        <button data-set="ashtanga" aria-pressed="false">Ashtanga</button>
      </div>
      <div class="seg" role="group" aria-label="Mode">
        <button data-mode="cards" aria-pressed="true">Flashcards</button>
        <button data-mode="quiz" aria-pressed="false">Quiz</button>
      </div>
      <div class="seg" role="group" aria-label="Show first">
        <button data-dir="pose" aria-pressed="true">Drawing first</button>
        <button data-dir="sa" aria-pressed="false">Sanskrit first</button>
        <button data-dir="en" aria-pressed="false">English first</button>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Pose family"></div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="onlyLearning"> Only poses I'm still learning</label>
      <span class="spacer"></span>
      <button class="link" id="shuffle">Shuffle</button>
      <button class="link" id="reset">Reset progress</button>
    </div>
  </div>

  <main id="main"></main>

  <footer id="foot"></footer>
</div>

<script>
const POSES = [

function figureSVG(name){
  const f=FIGS[name]; if(!f) return "";
  const [h,n,p,le,lh,re,rh,lk,lf,rk,rf]=f.p;
  const L=(pts,cls)=>`<polyline class="${cls}" points="${pts.map(q=>q.join(",")).join(" ")}"/>`;
  const torso = f.c ? `<path class="near" d="M${n} Q${f.c} ${p}"/>` : L([n,p],"near");
  return `<svg class="fig" viewBox="0 0 200 190" role="img" aria-label="Drawing of the pose">
    <line class="floor" x1="6" y1="182" x2="194" y2="182"/>
    ${f.wall?`<line class="floor" x1="${f.wall}" y1="60" x2="${f.wall}" y2="182"/>`:""}
    ${L([n,le,lh],"far")}${L([p,lk,lf],"far")}
    ${torso}
    ${L([p,rk,rf],"near")}${L([n,re,rh],"near")}
    <circle class="head" cx="${h[0]}" cy="${h[1]}" r="11"/>
  </svg>`;
}

const ASHTANGA = ASH_RAW.map(([c,s,v,i,e,r,f,noAsana])=>({c,s,v,i,e,f:f||s,r:noAsana?r:[...r,["āsana","pose, seat"]]}));
{const counts={};ASHTANGA.forEach(p=>{p.n=(counts[p.c]=(counts[p.c]||0)+1);});ASHTANGA.forEach(p=>p.of=counts[p.c]);}

const SETS = {general:POSES, ashtanga:ASHTANGA};
const keyOf = p => p.s+(p.v?" "+p.v:"");
const dn = p => p.s+(p.v?" "+p.v:"");
const iastOf = p => p.i+(p.v&&!p.i.endsWith(p.v)?" "+p.v:"");
const KEY = "asana-flashcards-known-v2";

const st = {set:"general",mode:"cards",dir:"pose",cat:"All",onlyLearning:false,deck:[],idx:0,flipped:false,known:new Set(),quiz:null,score:{right:0,total:0}};
try{const raw=localStorage.getItem(KEY); if(raw) st.known=new Set(JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...st.known]));}catch(e){}}

const $ = s=>document.querySelector(s);
const esc = t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffleArr = a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function pool(){return SETS[st.set].filter(p=>st.cat==="All"||p.c===st.cat);}
function buildDeck(shuffle){
  let d = pool();
  if(st.onlyLearning) d = d.filter(p=>!st.known.has(keyOf(p)));
  st.deck = shuffle ? shuffleArr([...d]) : d;
  st.idx = 0; st.flipped = false;
}

/* Pose images: uses images/<name>.png|jpg|jpeg|webp when present, otherwise the stick figure */
const IMG = {};
const slugOf = k => k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function currentPose(){ return st.mode==="cards" ? st.deck[st.idx] : st.quiz && st.quiz.p; }
function probe(slug){
  IMG[slug]="pending";
  const exts=["png","jpg","jpeg","webp"]; let i=0;
  const next=()=>{
    if(i>=exts.length){ IMG[slug]=false; return; }
    const url=`images/${slug}.${exts[i++]}`, im=new Image();
    im.onload=()=>{ IMG[slug]=url; const c=currentPose(); if(c && slugOf(c.f)===slug) render(); };
    im.onerror=next; im.src=url;
  };
  next();
}
function art(p,small){
  const slug=slugOf(p.f), u=IMG[slug];
  if(u && u!=="pending") return `<img class="art${small?" small":""}" src="${u}" alt="Sketch of ${esc(p.e)}">`;
  if(u===undefined) probe(slug);
  const svg=figureSVG(p.f);
  return small ? svg.replace('class="fig"','class="fig small"') : svg;
}
function preload(p){ if(p){ const sl=slugOf(p.f); if(IMG[sl]===undefined) probe(sl); } }

function rootsHTML(p){
  return `<div class="roots" aria-label="Word roots">${p.r.map((r,k)=>
    (k?`<span class="plus" aria-hidden="true">+</span>`:"")+
    `<div class="root"><b lang="sa">${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("")}</div>`;
}
function sanskritBlock(p,big){
  return `<p class="${big?"big":"mid"}" lang="sa">${esc(dn(p))}</p><div class="iast" lang="sa">${esc(iastOf(p))}</div>`;
}
function catLabel(p){
  if(st.set!=="ashtanga") return esc(p.c);
  return p.c==="Finishing" ? `Finishing sequence · ${p.n} of ${p.of}` : `${esc(p.c)} series · ${p.n} of ${p.of}`;
}

function renderStats(){
  const p = pool(), k = p.filter(x=>st.known.has(keyOf(x))).length;
  $("#stats").innerHTML = `<strong>${k}</strong> of ${p.length} known${st.cat==="All"?(st.set==="ashtanga"?" in Ashtanga":""):" in "+esc(st.cat)}`;
}

function renderCards(){
  const main = $("#main");
  if(!st.deck.length){
    main.innerHTML = `<div class="empty"><p>You've marked every pose in this set as known.</p>
      <button class="btn" id="showAll">Study all poses in this set</button></div>`;
    $("#showAll").onclick=()=>{st.onlyLearning=false;$("#onlyLearning").checked=false;buildDeck();render();};
    return;
  }
  preload(st.deck[st.idx+1]);
  const p = st.deck[st.idx], isKnown = st.known.has(keyOf(p));
  const front = st.dir==="pose"
    ? `${art(p)}<p class="prompt">Say the Sanskrit name out loud</p>`
    : st.dir==="sa" ? `${sanskritBlock(p,true)}` : `<p class="big">${esc(p.e)}</p>`;
  const back = st.dir==="pose"
    ? `${sanskritBlock(p,false)}<div class="cat">${esc(p.e)}</div>${rootsHTML(p)}`
    : `${art(p,true)}` + (st.dir==="sa"
      ? `<p class="mid">${esc(p.e)}</p>${rootsHTML(p)}`
      : `${sanskritBlock(p,false)}${rootsHTML(p)}`);
  const pct = Math.round(((st.idx+1)/st.deck.length)*100);
  main.innerHTML = `
    <div class="stage">
      <button class="card${st.flipped?" flipped":""}" id="card" aria-label="Flashcard. Press to ${st.flipped?"see the front":"reveal the answer"}">
        <div class="face front" aria-hidden="${st.flipped}"><span class="cat">${catLabel(p)}${isKnown?" · known":""}</span>${front}<span class="hint">Tap or press space to reveal</span></div>
        <div class="face back" aria-hidden="${!st.flipped}"><span class="cat">${catLabel(p)}</span>${back}</div>
      </button>
    </div>
    <div class="actions">
      <button class="btn nav" id="prev" aria-label="Previous card" ${st.idx===0?"disabled":""}>‹</button>
      <button class="btn learn" id="learn">Still learning</button>
      <button class="btn know" id="know">Got it</button>
      <button class="btn nav" id="next" aria-label="Next card" ${st.idx>=st.deck.length-1?"disabled":""}>›</button>
    </div>
    <div class="progress"><span>Card ${st.idx+1} of ${st.deck.length}</span><span>${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="keys"><kbd>Space</kbd> flip &nbsp; <kbd>←</kbd><kbd>→</kbd> move &nbsp; <kbd>1</kbd> still learning &nbsp; <kbd>2</kbd> got it</p>`;
  $("#card").onclick = flip;
  $("#prev").onclick = ()=>go(-1);
  $("#next").onclick = ()=>go(1);
  $("#learn").onclick = ()=>mark(false);
  $("#know").onclick = ()=>mark(true);
}
function flip(){st.flipped=!st.flipped; const c=$("#card"); if(c){c.classList.toggle("flipped",st.flipped);
  c.querySelector(".front").setAttribute("aria-hidden",st.flipped); c.querySelector(".back").setAttribute("aria-hidden",!st.flipped);}}
function go(d){const n=st.idx+d; if(n<0||n>=st.deck.length) return; st.idx=n; st.flipped=false; renderCards();}
function mark(known){
  const p = st.deck[st.idx];
  known ? st.known.add(keyOf(p)) : st.known.delete(keyOf(p));
  save(); renderStats();
  if(st.onlyLearning && known){
    st.deck.splice(st.idx,1);
    if(st.idx>=st.deck.length) st.idx=Math.max(0,st.deck.length-1);
    st.flipped=false; renderCards(); return;
  }
  if(st.idx<st.deck.length-1){st.idx++; st.flipped=false;}
  renderCards();
}

/* Quiz */
function newQuestion(){
  let candidates = pool();
  if(st.onlyLearning){const l=candidates.filter(p=>!st.known.has(keyOf(p))); if(l.length) candidates=l;}
  const prev = st.quiz && st.quiz.p;
  let p; do{p=candidates[Math.floor(Math.random()*candidates.length)];}while(candidates.length>1&&p===prev);
  let others = pool().filter(x=>x!==p);
  if(others.length<3) others = SETS[st.set].filter(x=>x!==p);
  const opts = shuffleArr([p,...shuffleArr([...others]).slice(0,3)]);
  st.quiz = {p,opts,answered:false};
}
function renderQuiz(){
  if(!st.quiz) newQuestion();
  const {p,opts,answered,choice} = st.quiz;
  const prompt = st.dir==="pose" ? `<div style="display:flex;justify-content:center">${art(p)}</div>`
    : st.dir==="sa" ? sanskritBlock(p,true) : `<p class="big">${esc(p.e)}</p>`;
  const label = o => st.dir==="sa" ? esc(o.e) : `<span lang="sa">${esc(dn(o))}</span>`;
  $("#main").innerHTML = `
    <div class="quiz">
      <span class="cat">${st.dir==="sa"?"What is this pose in English?":"What is this pose in Sanskrit?"}</span>
      ${prompt}
      <div class="options">${opts.map((o,k)=>{
        let cls="opt"; if(answered){ if(o===p) cls+=" right"; else if(o===choice) cls+=" wrong"; }
        return `<button class="${cls}" data-k="${k}" ${answered?"disabled":""}>${label(o)}</button>`;}).join("")}</div>
      <div class="feedback ${answered?(choice===p?"good":"bad"):""}" aria-live="polite">${answered?(choice===p?"Correct.":"Not quite. The answer is highlighted."):""}</div>
      ${answered?(st.dir==="pose"?`<div class="cat" style="margin-top:8px">${esc(p.e)}</div>`:"")+rootsHTML(p)+`<button class="btn next" id="nextQ">Next question</button>`:""}
    </div>
    <div class="progress"><span>Score: ${st.score.right} / ${st.score.total}</span>
      <button class="link" id="resetScore">Reset score</button></div>
    <p class="keys"><kbd>1</kbd>–<kbd>4</kbd> choose &nbsp; <kbd>Enter</kbd> next question</p>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(answered) $("#nextQ").onclick=()=>{newQuestion();renderQuiz();$(".opt")?.focus();};
  $("#resetScore").onclick=()=>{st.score={right:0,total:0};renderQuiz();};
}
function answer(k){
  const q=st.quiz; if(q.answered) return;
  q.answered=true; q.choice=q.opts[k];
  st.score.total++; if(q.choice===q.p) st.score.right++;
  renderQuiz(); $("#nextQ")?.focus();
}

function render(){
  document.querySelectorAll("[data-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.set===st.set));
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===st.mode));
  document.querySelectorAll("[data-dir]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dir===st.dir));
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===st.cat));
  $("#foot").textContent = st.set==="ashtanga"
    ? "Ashtanga cards follow the traditional K. Pattabhi Jois sequence order. Some shalas name or order a few poses differently."
    : "Spellings vary between lineages and teachers. Transliteration shown in IAST.";
  $("#shuffle").textContent = st.mode==="cards" ? "Shuffle" : "Skip question";
  renderStats();
  st.mode==="cards" ? renderCards() : renderQuiz();
}

function renderChips(){
  const cats = ["All",...new Set(SETS[st.set].map(p=>p.c))];
  const name = c => c==="All" ? (st.set==="ashtanga"?"All series":"All") : (st.set==="ashtanga"&&c!=="Finishing" ? c+" series" : c);
  $("#chips").innerHTML = cats.map(c=>`<button class="chip" data-cat="${esc(c)}">${esc(name(c))}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.cat=b.dataset.cat; buildDeck(); st.quiz=null; render();});
}
renderChips();
document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{ if(st.set===b.dataset.set) return;
  st.set=b.dataset.set; st.cat="All"; renderChips(); buildDeck(); st.quiz=null; render();});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode; if(st.mode==="quiz") st.quiz=null; render();});
document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{st.dir=b.dataset.dir; st.flipped=false; render();});
$("#onlyLearning").onchange=e=>{st.onlyLearning=e.target.checked; buildDeck(); st.quiz=null; render();};
$("#shuffle").onclick=()=>{ if(st.mode==="cards"){buildDeck(true);} else {newQuestion();} render(); };
let resetArmed=null;
$("#reset").onclick=()=>{
  const btn=$("#reset");
  if(!resetArmed){ btn.textContent="Click again to clear progress"; resetArmed=setTimeout(()=>{resetArmed=null;btn.textContent="Reset progress";},3000); return; }
  clearTimeout(resetArmed); resetArmed=null; btn.textContent="Progress cleared";
  st.known.clear(); save(); buildDeck(); render();
  setTimeout(()=>{btn.textContent="Reset progress";},1500);
};

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.metaKey||e.ctrlKey||e.altKey) return;
  if(st.mode==="cards"){
    if(!st.deck.length) return;
    if(e.key===" "){e.preventDefault(); flip();}
    else if(e.key==="ArrowRight") go(1);
    else if(e.key==="ArrowLeft") go(-1);
    else if(e.key==="1") mark(false);
    else if(e.key==="2") mark(true);
  } else {
    if(/^[1-4]$/.test(e.key)) answer(+e.key-1);
    else if(e.key==="Enter" && st.quiz?.answered && e.target.id!=="nextQ"){newQuestion();renderQuiz();}
  }
});

buildDeck(); render();
</script>
</body>
</html>
